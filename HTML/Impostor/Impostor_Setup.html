<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impostor Setup</title>

    <link rel="stylesheet" href="/CSS/Impostor/Impostor_Setup_Style.css" />
  </head>

  <body>

    <header>

        <a href="../Game_Selection.html" id="Return-Link">
            <div id="Return-Button">
                <h1 id="Impostor-Title">
                    <img src="/Images/Return_Arrow.png" alt="Question Mark"/>
                </h1>
            </div>
        </a>

        <!-- Progress bar indicating paragraphs read and how many times continue has been clicked/pressed -->
        <div id="Progress-Bar">
            <div class="Progress-Dot Current-Paragraph" id="Progress-1"></div>
            <div class="Progress-Dot Unselected-Paragraph" id="Progress-2"></div>
            <div class="Progress-Dot Unselected-Paragraph" id="Progress-3"></div>
            <div class="Progress-Dot Unselected-Paragraph" id="Progress-4"></div>
        </div>

        <a href="Impostor_Gameplay.html" id="Skip-Link">
            <div id="Skip-Button">
                <h1 id="Skip-Text">
                    Skip
                </h1>
            </div>
        </a>

    </header>

    <div id="QuestionMark">
        <img src="/Images/QuestionMark.png" alt="Question Mark"/>
    </div>

    <main>

        <div class="Description-Container">

            <h1 id="Impostor-Description">
            </h1>

        </div>

        <div id="Continue">
            <h1 id="Continue-Text">Continue</h1>
        </div>

    </main>
    <script src="/JS/Impostor/Impostor_Setup_Script.js"></script>
  </body>

</html>
