<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Imposter | Party Game</title>

    <link rel="stylesheet" href="/CSS/Impostor/Impostor_Gameplay_Style.css">
</head>

<body>

    <main id="gameScreen">

        <!-- ==========================
             PLAYER INFORMATION
        =========================== -->

        <section id="playerInfo">

            <p id="playerNumber">
                PLAYER 1
            </p>

            <h1 id="playerName">
                Player
            </h1>

        </section>


        <!-- ==========================
             SWIPE AREA
        =========================== -->

        <section id="swipeArea">

            <div id="instructionContainer">

                <p id="instruction">
                    SWIPE UP TO REVEAL
                </p>

                <div id="swipeArrow">
                    ↑
                </div>

            </div>


            <!-- ==========================
                 ROLE REVEAL
            =========================== -->

            <div id="roleReveal">

                <p id="roleLabel">
                    YOUR ROLE
                </p>

                <h2 id="role">
                    CIVILIAN
                </h2>

                <div id="secretContainer">

                    <p id="secretLabel">
                        SECRET WORD
                    </p>

                    <h3 id="secretWord">
                        WORD
                    </h3>

                </div>

            </div>

        </section>


        <!-- ==========================
             NEXT PLAYER
        =========================== -->

        <section id="nextSection">

            <button id="nextPlayerButton">
                NEXT PLAYER
            </button>

        </section>

        <!-- ==========================
        DISCUSSION TIMER
        ========================== -->

        <section id="timerSection">

            <p id="timerLabel">
                TIME REMAINING
            </p>

            <div id="timer">
                00:00
            </div>

            <p id="discussionText">
                DISCUSS WHO YOU THINK IS THE IMPOSTER
            </p>

        </section>


        <!-- ==========================
            VOTING
        ========================== -->

        <section id="votingSection">

            <p id="voteLabel">
                VOTE OUT:
            </p>

            <div id="voteList">
                <!-- Player buttons generated by JS -->
            </div>

        </section>

        <!-- ==========================
     SUCCESS SCREEN
========================== -->

        <section id="successSection">

            <p id="successLabel">
                SUCCESS!
            </p>

            <h1 id="successTitle">
                IMPOSTER FOUND
            </h1>

            <p id="successMessage">
                The imposter was voted out!
            </p>

            <div id="gameOverButtons">

                <button id="playAgainButton" class="game-over-button">
                    PLAY AGAIN
                </button>

                <button id="settingsButton"class="game-over-button secondary-game-button">
                    GAME SETTINGS
                </button>

            </div>

        </section>

    </main>


    <script src="/JS/Impostor/Impostor_Gameplay_Script.js"></script>

</body>

</html>
