<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colour Match</title>

    <link rel="stylesheet" href="/CSS/Colour Match/Colour_Match_Gamemode_Style.css">
</head>

<body>

        <header class="game-header">
            <h1>
                COLOUR MATCH
            </h1>
        </header>

        <main class="gamemode">

            <section class="gamemode-container">

                <div class="gamemode-card">

                    <h2>Timer Countdown</h2>

                    <p>
                        The colour shows for 4 seconds.
                        <br>
                        Remember it, then recreate it.
                    </p>
                
                </div>

                <div class="gamemode-card">

                    <h2>Hold to Peek</h2>
                    
                    <p>
                        Hold your finger on the screen to
                        <br> 
                        see the colour as long as you need.
                    </p>

                </div>

                <button class="start-game-button">Start Game</button>
        </main>

</body>

</html>
